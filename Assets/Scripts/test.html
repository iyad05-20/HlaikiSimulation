<style data-purpose="ui-elements">
    .modern-islamic-btn {
      background: rgba(10, 15, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      transition: all 0.3s ease;
      clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 15px, 100% calc(100% - 15px), calc(100% - 15px) 100%, 15px 100%, 0 calc(100% - 15px), 0 15px);
    }

    .modern-islamic-btn:hover {
      background: rgba(20, 25, 30, 0.8);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .modern-islamic-btn.active {
      background: rgba(25, 35, 45, 0.8);
      border-color: #e6d5b8;
      box-shadow: 0 0 20px rgba(230, 213, 184, 0.2);
    }

    .geom-pattern {
      background-image: 
        linear-gradient(0deg, transparent 49%, rgba(255,255,255,0.05) 49%, rgba(255,255,255,0.05) 51%, transparent 51%),
        linear-gradient(90deg, transparent 49%, rgba(255,255,255,0.05) 49%, rgba(255,255,255,0.05) 51%, transparent 51%),
        linear-gradient(45deg, transparent 49%, rgba(255,255,255,0.05) 49%, rgba(255,255,255,0.05) 51%, transparent 51%),
        linear-gradient(-45deg, transparent 49%, rgba(255,255,255,0.05) 49%, rgba(255,255,255,0.05) 51%, transparent 51%);
      background-size: 40px 40px;
      background-position: center;
    }

    .thumbnail-mask {
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%);
    }

    .level-badge {
      background: #1a1525;
      border: 2px solid #a89f91;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }
    
    .level-badge::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid #6b5a82;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    .ornate-corners::before, .ornate-corners::after {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border: 3px solid #5a4b70;
      opacity: 0.5;
    }
    .ornate-corners::before { top: 30px; left: 30px; border-right: none; border-bottom: none; }
    .ornate-corners::after { bottom: 30px; left: 30px; border-right: none; border-top: none; }
  </style>
